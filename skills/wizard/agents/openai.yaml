interface:
  short_description: "Guide an idea from research to an agreed plan or change"
  default_prompt: "Use $wizard to research this idea, or run $agenda-roadmap first if I am unsure what to build for a new or expanding project, question me thoroughly on architecture and product decisions, surface blockers, settle technical decisions with $decide, then propose follow-ups and improvements, then plan it if it is large or implement it after I confirm if it is small."

policy:
  allow_implicit_invocation: true
